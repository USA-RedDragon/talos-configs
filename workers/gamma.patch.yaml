machine:
  certSANs:
  - gamma
  - 127.0.0.1
  - 192.168.1.252
  disks:
  - device: /dev/disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S75BNS0W539291L
    partitions:
    - mountpoint: /var/lib/longhorn-ssd
  - device: /dev/disk/by-id/nvme-Samsung_SSD_980_500GB_S64ENJ0RA27288W
    partitions:
    - mountpoint: /var/lib/longhorn-nvme-1
  - device: /dev/disk/by-id/nvme-Samsung_SSD_980_500GB_S64ENJ0RA00740K
    partitions:
    - mountpoint: /var/lib/longhorn-nvme-2
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/ata-Samsung_SSD_870_EVO_1TB_S75BNS0W532663J" in disk.symlinks'
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
  - 192.168.1.252/32
  - fdeb:abba:237c::/48
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  devices.system.cpu.cpu0.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu1.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu2.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu3.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu4.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu5.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu6.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu7.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu8.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu9.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu10.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu11.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu12.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu13.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu14.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu15.cpufreq.scaling_governor: performance
  class.scsi_host.host0.link_power_management_policy: max_performance
  class.scsi_host.host1.link_power_management_policy: max_performance
  class.scsi_host.host2.link_power_management_policy: max_performance
  class.scsi_host.host3.link_power_management_policy: max_performance
  class.scsi_host.host4.link_power_management_policy: max_performance
  class.scsi_host.host5.link_power_management_policy: max_performance
  # Three SDRs share the usbfs memory pool here (the RSP1A for trunk-recorder
  # and the dump978 and ultrafeeder RTL-SDRs). At the 16 MB default the RSP1A's
  # isochronous submits intermittently failed with errno=12 (ENOMEM), and on
  # 2026-10-07 its stream never recovered. 0 removes the cap.
  module.usbcore.parameters.usbfs_memory_mb: "0"
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia
parameters:
- NVreg_OpenRmEnableUnsupportedGpus=1
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_uvm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_drm
---
apiVersion: v1alpha1
kind: KernelModuleConfig
name: nvidia_modeset
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: gamma
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "e4:1d:2d:50:fb:10"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net0
