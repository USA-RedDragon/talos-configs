machine:
  certSANs:
  - psi
  - 127.0.0.1
  - 192.168.1.250
  install:
    disk: /dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S78HNL0X201236K
    wipe: true
    bootloader: true
  disks:
  - device: /dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S78HNL0X202658K
    partitions:
      - mountpoint: /var/lib/longhorn-nvme
  files:
    - content: |
        [metrics]
          address = "0.0.0.0:11234"
      path: /etc/cri/conf.d/20-customization.part
      op: create
  kubelet:
    nodeIP:
      validSubnets:
      - 192.168.1.250/32
      - fdeb:abba:237c::/48
  sysfs:
    devices.system.cpu.cpu0.cpufreq.scaling_governor: performance
    devices.system.cpu.cpu1.cpufreq.scaling_governor: performance
    devices.system.cpu.cpu2.cpufreq.scaling_governor: performance
    devices.system.cpu.cpu3.cpufreq.scaling_governor: performance
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: psi
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "e8:ff:1e:d3:47:8d"
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net1
selector:
  match: mac(link.permanent_addr) == "e8:ff:1e:d3:47:8e"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net0
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net1
