machine:
  certSANs:
  - chi
  - 127.0.0.1
  - 192.168.1.249
  disks:
  - device: /dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S78HNL0X201241F
    partitions:
    - mountpoint: /var/lib/longhorn-nvme
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: '"/dev/disk/by-id/nvme-Samsung_SSD_980_1TB_S78HNL0X202650F" in disk.symlinks'
  wipe: true
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
  - 192.168.1.249/32
  - fdeb:abba:237c::/48
---
apiVersion: v1alpha1
kind: SysfsConfig
params:
  devices.system.cpu.cpu0.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu1.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu2.cpufreq.scaling_governor: performance
  devices.system.cpu.cpu3.cpufreq.scaling_governor: performance
---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: chi
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net0
selector:
  match: mac(link.permanent_addr) == "e8:ff:1e:d3:45:71"
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: net1
selector:
  match: mac(link.permanent_addr) == "e8:ff:1e:d3:45:72"
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net0
---
apiVersion: v1alpha1
kind: DHCPv4Config
name: net1
